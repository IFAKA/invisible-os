name: Android

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Local properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # app/gradle.properties names the owner's Mac JDK; the user-home file wins over it
          mkdir -p ~/.gradle && echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
      - name: Tests, kit rules, debug build
        run: ./gradlew testDebugUnitTest checkVoiceKit assembleDebug --stacktrace
